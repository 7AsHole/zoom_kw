<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zoom kw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
     <div class="container">

        <main class="konten-utama">
            <div class="stage-header">
                <div class="stage-title">
                    <h1>Call</h1>
                    <div class="stage-meta">
                        <span class="liveDot" id="liveDot"></span>
                        <span class="activeUser" id="activeUser">Belum dimulai &middot; 0 peserta</span>
                    </div>
                </div>

                <div class="call-setup" id="callSetup">
                    <input id="callInput" type="text" placeholder="Paste a call ID to join…" autocomplete="off" />
                    <button id="copyLink" class="setup-btn" title="Copy call link" aria-label="Copy call link">
                        <i class="fa-solid fa-link"></i>
                    </button>
                    <button id="callButton" class="setup-btn" title="Start a new call" aria-label="Start a new call">
                        <i class="fa-solid fa-phone"></i>
                    </button>
                    <button id="answerButton" class="setup-btn" title="Join with call ID" aria-label="Join with call ID">
                        <i class="fa-solid fa-check"></i>
                    </button>
                </div>
            </div>

            <div class="call-stage">
                <div class="call-grid">
                    <div class="participant-tile1" id="localTile">
                        <video id="webcamVideo" autoplay playsinline muted></video>
                        <div class="avatar one">U1</div>
                        <div class="tile-tag">
                            <i id="localMicIcon" class="mic-icon fa-solid fa-microphone active"></i>
                            <span>User 1</span>
                        </div>
                    </div>
                    <div class="participant-tile2" id="remoteTile">
                        <video id="remoteVideo" autoplay playsinline></video>
                        <div class="avatar two">U2</div>
                        <div class="tile-tag">
                            <i id="remoteMicIcon" class="mic-icon fa-solid fa-microphone active"></i>
                            <span>User 2</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <footer class="player-bar">
        <div class="footer-controls">
            <button id="micButton" class="ctrl-btn" title="Mute microphone" aria-label="Mute microphone">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button id="webcamButton" class="ctrl-btn" title="Turn on camera" aria-label="Turn on camera">
                <i class="fa-solid fa-video"></i>
            </button>
            <button id="sharescreenButton" class="ctrl-btn" title="Share screen" aria-label="Share screen">
                <i class="fa-solid fa-display"></i>
            </button>
            <button id="hangupButton" class="ctrl-btn danger" title="Hang up" aria-label="Hang up" disabled>
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
