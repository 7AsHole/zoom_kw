<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zoom kw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body>
     <div class="container">

        <main class="konten-utama">
            <div class="stage-header">
                <div class="stage-title">
                    <h1>Call</h1>
                    <div class="stage-meta">
                        <span class="liveDot"></span>
                        <span class="activeUser">Berlangsung &middot; 2 peserta</span>
                    </div>
                </div>

                <div class="call-setup" id="callSetup">
                    <input id="callInput" type="text" placeholder="Paste a call ID to join…" autocomplete="off" />
                    <button id="copyLink" class="setup-btn" title="Copy call link" aria-label="Copy call link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                    </button>
                    <button id="callButton" class="setup-btn" title="Start a new call" aria-label="Start a new call">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                    </button>
                    <button id="answerButton" class="setup-btn" title="Join with call ID" aria-label="Join with call ID">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="call-stage">
                <div class="call-grid">
                    <div class="participant-tile1" id="localTile">
                        <video id="webcamVideo" autoplay playsinline muted></video>
                        <div class="avatar one">U1</div>
                        <div class="tile-tag">
                            <svg class="mic-icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="23"/>
                            </svg>
                            <span>User 1</span>
                        </div>
                    </div>
                    <div class="participant-tile2" id="remoteTile">
                        <video id="remoteVideo" autoplay playsinline></video>
                        <div class="avatar two">U2</div>
                        <div class="tile-tag">
                            <svg class="mic-icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="23"/>
                            </svg>
                            <span>User 2</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <footer class="player-bar">
        <div class="footer-controls">
            <button id="micButton" class="ctrl-btn" title="Mute microphone" aria-label="Mute microphone">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <button id="webcamButton" class="ctrl-btn" title="Turn on camera" aria-label="Turn on camera">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="23 7 16 12 23 17 23 7"/>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
            </button>
            <button id="sharescreenButton" class="ctrl-btn" title="Share screen" aria-label="Share screen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
            </button>
            <button id="hangupButton" class="ctrl-btn danger" title="Hang up" aria-label="Hang up" disabled>
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M1.5 12.7c4-4.6 8.6-6.9 10.5-6.9s6.5 2.3 10.5 6.9c.6.7.6 1.8-.1 2.4l-2.6 2.4a1.7 1.7 0 0 1-2.2.1l-2.3-1.8a1.7 1.7 0 0 1-.6-1.7l.3-1.3c-1-.4-2-.6-3-.6s-2 .2-3 .6l.3 1.3c.1.6-.1 1.3-.6 1.7l-2.3 1.8a1.7 1.7 0 0 1-2.2-.1l-2.6-2.4c-.7-.6-.7-1.7-.1-2.4z"/>
                </svg>
            </button>
        </div>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
