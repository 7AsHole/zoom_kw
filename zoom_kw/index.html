<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zoom kw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
     <div id="introSplash" class="intro-splash" aria-hidden="true">
        <div class="intro-mark">
            <span class="intro-zoom">ZOOM</span>
            <span class="intro-kw">KW</span>
        </div>
        <p class="intro-tag">Video call, disederhanakan.</p>
     </div>

     <div class="container">

        <main class="konten-utama">
            <div class="stage-header">
                <div class="stage-title">
                    <h1>Call</h1>
                    <div class="stage-meta">
                        <span class="liveDot" id="liveDot"></span>
                        <span class="activeUser" id="activeUser">Belum dimulai &middot; 0 peserta</span>
                    </div>
                </div>

                <div class="call-setup" id="callSetup">
                    <input id="callInput" type="text" placeholder="Paste a call ID to join…" autocomplete="off" />
                    <button id="copyLink" class="setup-btn" title="Copy call link" aria-label="Copy call link" disabled>
                        <i class="fa-solid fa-link"></i>
                    </button>
                    <button id="callButton" class="setup-btn" title="Start a new call" aria-label="Start a new call" disabled>
                        <i class="fa-solid fa-phone"></i>
                    </button>
                    <button id="answerButton" class="setup-btn" title="Join with call ID" aria-label="Join with call ID" disabled>
                        <i class="fa-solid fa-check"></i>
                    </button>
                </div>
            </div>

            <div class="call-stage">
                <div class="call-grid" id="callGrid" data-count="0"></div>
            </div>
        </main>

    </div>

    <footer class="player-bar">
        <div class="footer-controls">
            <button id="micButton" class="ctrl-btn" title="Mute microphone" aria-label="Mute microphone">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button id="webcamButton" class="ctrl-btn" title="Turn on camera" aria-label="Turn on camera">
                <i class="fa-solid fa-video"></i>
            </button>
            <button id="flipcamButton" class="ctrl-btn" title="Flip camera">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
            <button id="sharescreenButton" class="ctrl-btn" title="Share screen" aria-label="Share screen">
                <i class="fa-solid fa-display"></i>
            </button>
            <button id="hangupButton" class="ctrl-btn danger" title="Hang up" aria-label="Hang up" disabled>
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
